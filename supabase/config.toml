# Local Supabase stack configuration (supabase start). Production settings are
# configured in the Supabase dashboard – see docs/deployment.md.
project_id = "familypulse"

[api]
enabled = true
port = 54321
# Only the public schema is exposed via the Data API. Tokens live in
# public.provider_credentials, which has no grants for anon/authenticated.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Public registration is disabled: accounts are created only via invitations.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "60s"

[auth.rate_limit]
email_sent = 4
sign_in_sign_ups = 30
token_verifications = 30

[storage]
enabled = true
file_size_limit = "2MiB"
